# CI de HYUK — lint + tests + build en cada push/PR a main.
#
# - `lint` y `test` NO necesitan secretos (runner nativo node:test, sin deps).
# - `build` sí requiere las variables públicas de Supabase; configúralas como
#   secrets del repositorio (Settings → Secrets and variables → Actions):
#     NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#     NEXT_PUBLIC_ROOT_DOMAIN, NEXT_PUBLIC_APP_URL
#
# IMPORTANTE: este archivo se creó en local. No se ha hecho push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ROOT_DOMAIN: ${{ secrets.NEXT_PUBLIC_ROOT_DOMAIN }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}