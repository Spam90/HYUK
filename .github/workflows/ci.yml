# CI de HYUK — lint + tests + build en cada push/PR a main.
#
# - `lint` y `test` NO necesitan secretos: los tests usan el runner nativo
#   node:test sobre módulos puros (sin red ni base de datos).
# - `build`: Next.js no consulta la BD en build-time (sitemap.xml y /[slug] son
#   dinámicas con manejo de errores), por lo que puede compilar con valores
#   dummy. Las 4 variables son públicas (NEXT_PUBLIC_*): si el repositorio
#   define esos secrets se usan los valores reales; si no existen, se usan
#   valores dummy seguros solo para CI. Nunca se usan secretos privados
#   (service role, Stripe, tokens, etc.).
#
# Fail-fast: un fallo en lint, tests o build corta el workflow. Los pasos usan
# `npm run ...` (exit code != 0 en fallo), sin `|| true` ni `continue-on-error`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: lint + test + build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install (reproducible)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-check.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-anon-key-not-real' }}
          NEXT_PUBLIC_ROOT_DOMAIN: ${{ secrets.NEXT_PUBLIC_ROOT_DOMAIN || 'hyuk.app' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}

  e2e:
    name: public E2E smoke tests
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run public E2E smoke tests
        run: npm run e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-check.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-real
          NEXT_PUBLIC_ROOT_DOMAIN: hyuk.app
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
